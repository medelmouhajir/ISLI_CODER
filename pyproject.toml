[project]
name = "isli"
version = "0.1.0"
description = "ISLI — AI coding CLI with local intelligence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mohamed Amin EL-MOUHAJIR", email = "med.elmouhajir@gmail.com" }]
keywords = ["ai", "coding", "cli", "local-intelligence", "llm", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Cloud LLM interface (main reasoning brain)
    "litellm>=1.40",

    # CLI interface
    "rich>=13.0",
    "prompt-toolkit>=3.0",

    # Token counting
    "tiktoken>=0.7.0",

    # Data validation
    "pydantic>=2.0",

    # Model downloading
    "huggingface-hub>=0.20",

    # Configuration
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/medelmouhajir/ISLI_CODER"
Documentation = "https://github.com/medelmouhajir/ISLI_CODER#readme"
Repository = "https://github.com/medelmouhajir/ISLI_CODER.git"
Issues = "https://github.com/medelmouhajir/ISLI_CODER/issues"
Changelog = "https://github.com/medelmouhajir/ISLI_CODER/blob/main/CHANGELOG.md"

[project.optional-dependencies]
keeper = [
    # Local model inference (Keeper intelligence layer)
    "llama-cpp-python>=0.3.0",
]
keeper-cuda = [
    # CUDA VRAM acceleration runtime dependencies for Windows/Linux
    "llama-cpp-python>=0.3.0",
    "nvidia-cuda-runtime-cu12>=12.0",
    "nvidia-cublas-cu12>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
    "mypy>=1.10",
]
all = [
    "isli[keeper,dev]",
]

[project.scripts]
isli = "isli.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.10"
